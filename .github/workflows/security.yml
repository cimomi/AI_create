name: Security

# Server-side backstop. Local hooks can be bypassed with --no-verify; CI cannot
# be skipped. Note that this runs AFTER the push, so it detects and alerts
# rather than preventing the leak itself — only GitHub Push Protection blocks
# at push time. It re-scans on every push and pull request, history included.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: a shallow clone cannot see a leak that
          # was committed and later deleted, which is the easiest case to miss.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-audit:
    name: Repository audit (absolute paths / credential files / size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit
        run: python3 scripts/audit.py

  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python files
        run: |
          python3 -m compileall -q scripts skill-library-manager/tools skill-library-manager/skill-update-guard/scripts
          echo "all files compiled"
