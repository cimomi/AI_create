name: Security

# 服务端兜底：本地钩子可以 --no-verify 绕过，CI 不能。
# 每次推送与 PR 都会重新扫描，包含全部历史。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史——增量浅克隆扫不到旧提交里的泄漏，
          # 而"提交过又删掉"正是最容易被忽略的一种泄漏。
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-audit:
    name: 仓库审计（绝对路径 / 凭证文件 / 体积）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行审计
        run: python3 scripts/audit.py

  syntax-check:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译全部 Python 文件
        run: |
          python3 -m compileall -q scripts skill-library-manager/tools skill-library-manager/skill-update-guard/scripts
          echo "全部通过"
