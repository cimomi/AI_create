# gitleaks configuration: the official default ruleset plus a few local
# allowances. The default rules already number in the hundreds — do not
# rewrite them, only add exemptions.
[extend]
useDefault = true

[allowlist]
description = "Known-safe content in this repository: risk patterns quoted in the docs"
paths = [
  # The engineering notes quote real risk patterns (such as curl|bash) as
  # examples. They are not usable credentials.
  '''skill-library-manager/docs/ENGINEERING\.md$''',
]
